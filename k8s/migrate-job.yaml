apiVersion: batch/v1
kind: Job
metadata:
  name: tasks-migrate
  labels:
    app: tasks-migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: tasks-migrate
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: postgres:18-alpine
          command: ["sh", "-c"]
          args:
            - until pg_isready -h db -p 5432; do echo waiting for db; sleep 2; done
      containers:
        - name: migrate
          image: tasks-api:1.0.0
          command: ["python", "-m", "app.migrate"]
          envFrom:
            - secretRef:
                name: db-credentials
          env:
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db:5432/$(POSTGRES_DB)
