apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-config
data:
  APP_NAME: notes-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  labels:
    app: notes
spec:
  selector:
    matchLabels:
      app: notes
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notes
    spec:
      containers:
        - name: notes
          image: notes-api:1.3.0
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: notes-config
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notes
spec:
  selector:
    app: notes
  ports:
    - name: http
      port: 3000
      targetPort: 5000
